spring:
  application:
    name: gowithbae-be
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:application-uploads.yml
  datasource:
    # Supabase: Project Settings → Database → Connection string (JDBC). Dùng session pooler (port 5432) hoặc direct.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  # Giới hạn multipart đặt trong application-uploads.yml (5 MB), đủ cho CSV nhập địa điểm (tự giới hạn 2 MB).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false

app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    # Cách gửi mã OTP: smtp (mặc định, dùng spring.mail.*) hoặc brevo (API HTTPS, khi máy chủ chặn cổng SMTP như Render free).
    provider: ${MAIL_PROVIDER:smtp}
    # Địa chỉ người gửi; với brevo phải là sender đã xác minh trong Brevo.
    from: ${SMTP_FROM:}
    from-name: ${MAIL_FROM_NAME:GoWithBae}
    brevo:
      api-key: ${BREVO_API_KEY:}
  auth:
    mfa-key: ${AUTH_MFA_KEY:${app.jwt.secret}}
    # Google OAuth Client ID (loại Web application). Công khai, không phải secret; frontend dùng cùng giá trị (VITE_GOOGLE_CLIENT_ID).
    google-client-id: ${GOOGLE_CLIENT_ID:796222079602-49c170r0o3v2r24724eu0njjbi1i69uf.apps.googleusercontent.com}
    # CR-002: thành viên chỉ đăng nhập Google. Bật lại mã email cho thành viên bằng AUTH_MEMBER_OTP_ENABLED=true.
    member-otp-enabled: ${AUTH_MEMBER_OTP_ENABLED:false}
  accounts:
    # Tài khoản yêu cầu xóa mà quản trị viên không khôi phục sẽ tự bị xóa (ẩn danh hóa) sau số ngày này.
    deletion-grace-days: ${ACCOUNT_DELETION_GRACE_DAYS:30}
  places:
    # Ngày kiểm tra cũ hơn số ngày này thì tính là "quá hạn xác minh" trong báo cáo (OQ-20 chưa chốt ngưỡng).
    verification-max-age-days: ${PLACES_VERIFICATION_MAX_AGE_DAYS:180}
  files:
    # Nơi lưu nội dung tệp: local (thư mục trên đĩa, mặc định) hoặc supabase (Supabase Storage, bucket riêng tư).
    # Máy chủ không có ổ đĩa lâu dài (Render) phải dùng supabase, nếu không ảnh mất mỗi lần khởi động lại.
    storage: ${FILES_STORAGE:local}
    supabase:
      url: ${SUPABASE_URL:}
      # Secret key (sb_secret_...) hoặc service_role key. Chỉ đặt ở server, không đưa ra frontend.
      service-key: ${SUPABASE_SERVICE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:gowithbae-files}
    # URL gốc ghép với id tệp cho ảnh địa điểm/bộ sưu tập. Để trống = /api/v1/files/ (backend tự phục vụ ảnh đã gắn).
    # Đặt khi chuyển sang CDN/lưu trữ ngoài phục vụ theo id (OQ-21).
    public-base-url: ${FILES_PUBLIC_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
