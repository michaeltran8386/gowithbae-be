spring:
  application:
    name: gowithbae-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Supabase: Project Settings → Database → Connection string (JDBC). Dùng session pooler (port 5432) hoặc direct.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  jwt:
    secret: ${JWT_SECRET}
  files:
    # URL gốc để ghép với stored_file.storage_key (OQ-21 chưa chọn nơi lưu). Để trống = API trả coverUrl/url null.
    public-base-url: ${FILES_PUBLIC_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
