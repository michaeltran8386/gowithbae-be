openapi: 3.0.3
info:
  title: GoWithBae G1 API
  version: 0.2.0
  description: |
    API contract cho GoWithBae G1 (web khách hàng + quản trị nội bộ).
    Nguồn yêu cầu: `GWB-REQ-G1` v1.1 (15-11-2026), SRS hợp nhất v1.2 và CR-001.
    Phủ FR-01..35. Số lần đã đi, bỏ qua lời nhắc chỉ đóng và xem link không đăng nhập đã CONF;
    các nhánh actor/sửa lượt/nhắc lại sau đổi giờ còn OQ-10/25. Mỗi operation ghi mã FR/RULE liên quan.

    Quy ước:
    - `x-status: draft` = hành vi phụ thuộc câu hỏi mở (`x-oq`). Không tự chốt chính sách khi implement;
      hỏi PO trước. Operation không có `x-status` = theo FR đã có trong nguồn.
    - Lỗi trả `application/problem+json` (RFC 9457) kèm `traceId`; lỗi validation có `errors[]` theo trường.
    - Tài nguyên riêng tư không thuộc quyền trả `404` (không lộ sự tồn tại, FR-22).
    - Thời gian: ISO-8601 có offset; nghiệp vụ theo giờ Việt Nam (`Asia/Ho_Chi_Minh`). Tiền: số nguyên VND.
    - Thao tác tạo có thể bấm lặp nhận header `Idempotency-Key` (NFR-08).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: Discovery
    description: Khám phá, bộ sưu tập, danh mục lọc (FR-01, FR-03)
  - name: Places
    description: Tìm/lọc, chi tiết, so sánh, báo sai (FR-02..06, FR-19)
  - name: Auth
    description: Đăng nhập email OTP (FR-07)
  - name: Me
    description: Hồ sơ tài khoản (FR-08)
  - name: SavedLists
    description: Danh sách đã lưu (FR-09)
  - name: ChoiceSessions
    description: Cùng chọn hai người (FR-10..14)
  - name: ShareGrants
    description: Link mời và tham gia của người nhận (FR-11, FR-14)
  - name: DatePlans
    description: Kế hoạch buổi hẹn (FR-15..18)
  - name: Support
    description: Yêu cầu hỗ trợ của thành viên (FR-20)
  - name: Notifications
    description: Thông báo trong tài khoản (FR-21)
  - name: Uploads
    description: Tải tệp (RULE-27)
  - name: Events
    description: Sự kiện phân tích (FR-32)
  - name: AdminPlaces
    description: Biên tập, duyệt, ẩn địa điểm (FR-23, FR-24)
  - name: AdminTaxonomy
    description: Loại hình, nhãn, khu vực (FR-25)
  - name: AdminCollections
    description: Bộ sưu tập (FR-26)
  - name: AdminUsers
    description: Tài khoản và vai trò (FR-27)
  - name: AdminPlaceReports
    description: Xử lý báo sai (FR-28)
  - name: AdminSupport
    description: Xử lý hỗ trợ (FR-29)
  - name: AdminImports
    description: Nhập CSV (FR-30)
  - name: AdminAudit
    description: Nhật ký (FR-31)
  - name: AdminReports
    description: Báo cáo và xuất CSV (FR-33, FR-34)

paths:
  # ───────────────────────── Discovery ─────────────────────────
  /collections:
    get:
      tags: [Discovery]
      operationId: listCollections
      summary: Bộ sưu tập đang trong thời gian hiển thị (FR-01)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CollectionSummary' }
  /collections/{collectionId}:
    get:
      tags: [Discovery]
      operationId: getCollection
      summary: Chi tiết bộ sưu tập, chỉ gồm địa điểm đang công khai (FR-26, RULE-01)
      parameters: [{ $ref: '#/components/parameters/CollectionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /taxonomies:
    get:
      tags: [Discovery]
      operationId: listTaxonomies
      summary: Nhãn đang dùng theo nhóm, cho bộ lọc (FR-03, §5.1)
      parameters:
        - name: group
          in: query
          schema: { $ref: '#/components/schemas/TaxonomyGroup' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Taxonomy' }
  /areas:
    get:
      tags: [Discovery]
      operationId: listAreas
      summary: Danh mục khu vực đang dùng (FR-03)
      x-status: draft
      x-oq: [OQ-01]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Area' }

  # ───────────────────────── Places ─────────────────────────
  /places:
    get:
      tags: [Places]
      operationId: searchPlaces
      summary: Tìm, lọc, sắp xếp địa điểm đã duyệt (FR-02, FR-03, FR-04, RULE-01..05)
      description: |
        - `q` không phân biệt hoa/thường, hỗ trợ không dấu.
        - Các nhóm lọc kết hợp AND. Trong nhóm: ACTIVITY/STYLE/SCENERY/OCCASION là OR; VIBE/FEATURE/AMENITY là AND (RULE-02).
        - Thiếu giá/giờ/thuộc tính không thỏa bộ lọc tương ứng (RULE-04).
        - 0 kết quả vẫn trả 200, giữ nguyên điều kiện.
        - Công thức mức khớp (OQ-04), bán kính/khoảng cách (OQ-05) chưa chốt.
      x-status: draft
      x-oq: [OQ-03, OQ-04, OQ-05]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: areaId
          in: query
          schema: { type: string, format: uuid }
        - name: lat
          in: query
          description: Điểm gốc do người dùng cung cấp; bắt buộc đi cùng `lng`.
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, format: double, minimum: 0 }
        - name: budget
          in: query
          schema: { $ref: '#/components/schemas/BudgetBand' }
        - name: at
          in: query
          description: Ngày giờ dự định đến; chỉ trả nơi đã xác minh mở tại thời điểm này (RULE-05).
          schema: { type: string, format: date-time }
        - name: tagIds
          in: query
          description: Mã nhãn; server nhóm theo `TaxonomyGroup` và áp RULE-02.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [DEFAULT, NEAREST, PRICE_ASC]
            default: DEFAULT
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceSearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /places/compare:
    get:
      tags: [Places]
      operationId: comparePlaces
      summary: So sánh 2–3 địa điểm khác nhau (FR-06, RULE-06)
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 2
            maxItems: 3
            uniqueItems: true
            items: { type: string, format: uuid }
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lng
          in: query
          schema: { type: number, format: double }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /places/{placeId}:
    get:
      tags: [Places]
      operationId: getPlace
      summary: Chi tiết địa điểm đang công khai (FR-05)
      description: Link tới địa điểm đã ẩn xử lý theo OQ-11.
      x-status: draft
      x-oq: [OQ-11]
      parameters: [{ $ref: '#/components/parameters/PlaceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /places/{placeId}/reports:
    post:
      tags: [Places]
      operationId: reportPlace
      summary: Gửi báo sai, cho phép khách ẩn danh, có chống gửi hàng loạt (FR-19, RULE-18)
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceReportCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceReportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────── Auth ─────────────────────────
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Gửi mã một lần qua email (FR-07, RULE-16)
      description: Luôn trả 202 dù email chưa có tài khoản (không lộ tồn tại). Hạn mã/giới hạn gửi lại theo OQ-06.
      x-status: draft
      x-oq: [OQ-06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Xác minh mã, tạo tài khoản nếu chưa có, cấp phiên (FR-07, RULE-16)
      x-status: draft
      x-oq: [OQ-06]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Thu hồi phiên hiện tại (FR-08)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }

  # ───────────────────────── Me ─────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Sửa tên hiển thị, ảnh đại diện (FR-08)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/email-change:
    post:
      tags: [Me]
      operationId: requestEmailChange
      summary: Gửi mã xác minh tới email mới (FR-08)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/places/{placeId}/visit-count:
    get:
      tags: [Me]
      operationId: getMyPlaceVisitCount
      summary: Số lần tự xác nhận đã đi tại một chi nhánh của tài khoản hiện tại (FR-35, RULE-29)
      description: |
        Danh tính lấy từ bearer, không nhận userId từ client. Tính từ các lượt YES hợp lệ,
        mỗi plan/người chỉ một lượt; không đếm click, analytics, dismissal hoặc chuỗi ngày.
        Không cấp qua phiên khách hay ghép vào response địa điểm công khai. Lỗi đọc không được giả count=0.
        Lịch sử nơi ẩn và sửa lượt còn OQ-10/11/25; không chặn chức năng đếm lượt hợp lệ đã CONF.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlaceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceVisitCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/email-change/verify:
    post:
      tags: [Me]
      operationId: verifyEmailChange
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/deletion-request:
    post:
      tags: [Me]
      operationId: requestAccountDeletion
      summary: Yêu cầu xóa tài khoản; thu hồi phiên và link riêng ngay (FR-08, RULE-17)
      x-status: draft
      x-oq: [OQ-17]
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Accepted — chưa có nghĩa là đã xóa dữ liệu }

  # ───────────────────────── Saved lists ─────────────────────────
  /saved-lists:
    get:
      tags: [SavedLists]
      operationId: listSavedLists
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedListSummary' }
    post:
      tags: [SavedLists]
      operationId: createSavedList
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedListWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedListSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /saved-lists/{listId}:
    parameters: [{ $ref: '#/components/parameters/ListId' }]
    get:
      tags: [SavedLists]
      operationId: getSavedList
      summary: Danh sách và địa điểm; nơi đã ẩn giữ tên + cảnh báo (FR-09)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedListDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [SavedLists]
      operationId: renameSavedList
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedListWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedListSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [SavedLists]
      operationId: deleteSavedList
      summary: Xóa danh sách; không xóa địa điểm/kế hoạch (RULE-07)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
  /saved-lists/{listId}/places/{placeId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [SavedLists]
      operationId: addPlaceToList
      summary: Thêm địa điểm, idempotent — thêm lặp không tạo bản ghi mới (RULE-07)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [SavedLists]
      operationId: removePlaceFromList
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Choice sessions ─────────────────────────
  /choice-sessions:
    get:
      tags: [ChoiceSessions]
      operationId: listMyChoiceSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChoiceSession' }
    post:
      tags: [ChoiceSessions]
      operationId: createChoiceSession
      summary: Tạo phiên cùng chọn từ 2–5 địa điểm đã lưu, sinh link mời (FR-10, RULE-08)
      x-status: draft
      x-oq: [OQ-07, OQ-11]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeIds]
              properties:
                placeIds:
                  type: array
                  minItems: 2
                  maxItems: 5
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Created; `shareGrant.inviteToken` chỉ trả một lần
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChoiceSessionCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /choice-sessions/{sessionId}:
    get:
      tags: [ChoiceSessions]
      operationId: getChoiceSession
      summary: Người tạo hoặc người nhận còn quyền xem phiên (FR-12, FR-22)
      x-status: draft
      x-oq: [OQ-07]
      security: [{ bearerAuth: [] }, { recipientSession: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChoiceSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /choice-sessions/{sessionId}/votes/{candidateId}:
    put:
      tags: [ChoiceSessions]
      operationId: castVote
      summary: Thích/Bỏ qua một lựa chọn; sửa được trước khi chốt (FR-12, RULE-10)
      security: [{ bearerAuth: [] }, { recipientSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: candidateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preference]
              properties:
                preference: { $ref: '#/components/schemas/VotePreference' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /choice-sessions/{sessionId}/finalize:
    post:
      tags: [ChoiceSessions]
      operationId: finalizeChoiceSession
      summary: Người tạo chốt một lựa chọn và tạo kế hoạch trong cùng một thao tác (FR-13, RULE-11)
      x-status: draft
      x-oq: [OQ-08]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId, scheduledAt]
              properties:
                candidateId: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /choice-sessions/{sessionId}/share-grants:
    post:
      tags: [ChoiceSessions]
      operationId: createShareGrant
      summary: Cấp link mời mới; link cũ không tự khôi phục (FR-14)
      x-status: draft
      x-oq: [OQ-07, OQ-09]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareGrantCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
