            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                status: { $ref: '#/components/schemas/ActiveStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Admin: collections ─────────────────────────
  /admin/collections:
    get:
      tags: [AdminCollections]
      operationId: adminListCollections
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CollectionDetail' }
    post:
      tags: [AdminCollections]
      operationId: adminCreateCollection
      x-status: draft
      x-oq: [OQ-18]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/collections/{collectionId}:
    parameters: [{ $ref: '#/components/parameters/CollectionId' }]
    put:
      tags: [AdminCollections]
      operationId: adminUpdateCollection
      x-status: draft
      x-oq: [OQ-18]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionWrite' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [AdminCollections]
      operationId: adminDeleteCollection
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Admin: users ─────────────────────────
  /admin/users:
    get:
      tags: [AdminUsers]
      operationId: adminListUsers
      summary: Tìm tài khoản (FR-27); chỉ quản trị cao nhất
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/lock:
    post:
      tags: [AdminUsers]
      operationId: adminLockUser
      summary: Khóa có lý do; ghi audit (FR-27, RULE-17)
      x-status: draft
      x-oq: [OQ-17]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{userId}/unlock:
    post:
      tags: [AdminUsers]
      operationId: adminUnlockUser
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{userId}/roles:
    put:
      tags: [AdminUsers]
      operationId: adminSetUserRoles
      summary: Gán/bỏ vai trò; ghi audit; bảo vệ quản trị cuối (FR-27)
      x-status: draft
      x-oq: [OQ-18]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, reason]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Role' }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Admin: place reports ─────────────────────────
  /admin/place-reports:
    get:
      tags: [AdminPlaceReports]
      operationId: adminListPlaceReports
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlaceReportStatus' }
        - name: assigneeId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceReportPage' }
  /admin/place-reports/{reportId}:
    get:
      tags: [AdminPlaceReports]
      operationId: adminGetPlaceReport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ReportId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/place-reports/{reportId}/transitions:
    post:
      tags: [AdminPlaceReports]
      operationId: adminTransitionPlaceReport
      summary: Giao việc/chuyển trạng thái; đóng phải có ghi chú (FR-28, RULE-18)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ReportId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/PlaceReportStatus' }
                assigneeId: { type: string, format: uuid }
                note: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Admin: support ─────────────────────────
  /admin/support-tickets:
    get:
      tags: [AdminSupport]
      operationId: adminListTickets
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TicketStatus' }
        - name: assigneeId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketPage' }
  /admin/support-tickets/{ticketId}:
    get:
      tags: [AdminSupport]
      operationId: adminGetTicket
      summary: Gồm cả ghi chú INTERNAL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support-tickets/{ticketId}/messages:
    post:
      tags: [AdminSupport]
      operationId: adminReplyTicket
      summary: Trả lời PUBLIC hoặc ghi chú INTERNAL (FR-29, RULE-19)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MessageCreate'
                - type: object
                  required: [visibility]
                  properties:
                    visibility: { $ref: '#/components/schemas/MessageVisibility' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportMessage' }
  /admin/support-tickets/{ticketId}/transitions:
    post:
      tags: [AdminSupport]
      operationId: adminTransitionTicket
      x-status: draft
      x-oq: [OQ-13]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TicketId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TicketStatus' }
                assigneeId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Admin: CSV import ─────────────────────────
  /admin/imports/template.csv:
    get:
      tags: [AdminImports]
      operationId: adminDownloadImportTemplate
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema: { type: string }
  /admin/imports:
    post:
      tags: [AdminImports]
      operationId: adminValidateImport
      summary: Tải CSV và kiểm tra thử; chưa ghi dữ liệu (FR-30, RULE-23)
      x-status: draft
      x-oq: [OQ-19, OQ-21]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/imports/{batchId}:
    get:
      tags: [AdminImports]
      operationId: adminGetImport
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/imports/{batchId}/commit:
    post:
      tags: [AdminImports]
      operationId: adminCommitImport
      summary: Ghi lô thành nháp; mặc định chỉ khi toàn lô hợp lệ (FR-30)
      x-status: draft
      x-oq: [OQ-19]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/BatchId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Admin: audit & reports ─────────────────────────
  /admin/audit-logs:
    get:
      tags: [AdminAudit]
      operationId: adminListAuditLogs
      summary: Chỉ đọc (FR-31)
      x-status: draft
      x-oq: [OQ-17, OQ-18]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: objectType
          in: query
          schema: { type: string }
        - name: objectId
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
  /admin/reports/summary:
    get:
      tags: [AdminReports]
      operationId: adminReportSummary
      summary: Chỉ số §10.1; độ trễ tối đa 24 giờ (FR-33, RULE-26)
      x-status: draft
      x-oq: [OQ-20]
      security: [{ bearerAuth: [] }]
      parameters: &reportFilters
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: areaId
          in: query
          schema: { type: string, format: uuid }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: platform
          in: query
          schema: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reports/export.csv:
    get:
      tags: [AdminReports]
      operationId: adminExportReport
      summary: Xuất CSV cùng bộ lọc và quyền với báo cáo (FR-34)
      x-status: draft
      x-oq: [OQ-20]
      security: [{ bearerAuth: [] }]
      parameters: *reportFilters
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Phiên thành viên/nhân sự. Server kiểm tra phiên còn hiệu lực mỗi request (thu hồi có hiệu lực ngay).
    recipientSession:
      type: apiKey
      in: header
      name: X-Recipient-Session
      description: Phiên người nhận link (không cần tài khoản); phụ thuộc ShareGrant còn hiệu lực (RULE-12).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 64 }
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteToken:
      name: inviteToken
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 1000 }

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Chưa đăng nhập hoặc phiên hết hạn
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Không có quyền (chỉ dùng khi đối tượng không riêng tư)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tồn tại hoặc không có quyền xem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Vi phạm trạng thái/quy tắc nghiệp vụ (vd. suất người nhận đã có người, đã chốt)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Link hết hạn hoặc đã thu hồi
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Vượt hạn mức
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── common ──
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Mã lỗi nghiệp vụ, vd. RULE-06, SLOT_TAKEN' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ActiveStatus:
      type: string
      enum: [ACTIVE, DEPRECATED]
    Platform:
      type: string
      enum: [WEB_MOBILE, WEB_DESKTOP]
    Warning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: HOURS_UNKNOWN }
        message: { type: string }

    # ── discovery ──
    TaxonomyGroup:
      type: string
      enum: [CATEGORY, ACTIVITY, VIBE, STYLE, SCENERY, FEATURE, AMENITY, OCCASION]
    Taxonomy:
      type: object
      required: [id, group, code, name, status]
      properties:
        id: { type: string, format: uuid }
        group: { $ref: '#/components/schemas/TaxonomyGroup' }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    TaxonomyWrite:
      type: object
      required: [group, code, name]
      properties:
        group: { $ref: '#/components/schemas/TaxonomyGroup' }
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        name: { type: string, maxLength: 100 }
    Area:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/ActiveStatus' }
    AreaWrite:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        name: { type: string, maxLength: 100 }
    CollectionSummary:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        coverUrl: { type: string, format: uri, nullable: true }
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionSummary'
        - type: object
          properties:
            body: { type: string, nullable: true }
            visibleFrom: { type: string, format: date-time, nullable: true }
            visibleUntil: { type: string, format: date-time, nullable: true }
            places:
              type: array
              items: { $ref: '#/components/schemas/PlaceCard' }
    CollectionWrite:
      type: object
      required: [title, placeIds]
      properties:
        title: { type: string, maxLength: 150 }
        body: { type: string, maxLength: 5000 }
        coverFileId: { type: string, format: uuid }
        visibleFrom: { type: string, format: date-time }
        visibleUntil: { type: string, format: date-time }
        placeIds:
          type: array
          description: Theo thứ tự hiển thị
          items: { type: string, format: uuid }

    # ── places ──
    BudgetBand:
      type: string
      description: 'PROP RULE-03: FREE p=0; UNDER_200K 0<p<200000; FROM_200K_TO_400K 200000≤p<400000; FROM_400K_TO_700K 400000≤p≤700000; OVER_700K p>700000 (OQ-03)'
      enum: [FREE, UNDER_200K, FROM_200K_TO_400K, FROM_400K_TO_700K, OVER_700K]
    KnownStatus:
      type: string
      enum: [KNOWN, UNKNOWN]
    PlaceStatus:
      type: string
      enum: [DRAFT, PENDING, PUBLISHED, HIDDEN, INACTIVE]
    Price:
      type: object
      required: [status]
      description: 'KNOWN ⇒ 0 ≤ min ≤ standardForTwo ≤ max (VND). UNKNOWN ⇒ hiển thị "Chưa có thông tin".'
      properties:
        status: { $ref: '#/components/schemas/KnownStatus' }
        standardForTwo: { type: integer, format: int64, minimum: 0, nullable: true }
        min: { type: integer, format: int64, minimum: 0, nullable: true }
        max: { type: integer, format: int64, minimum: 0, nullable: true }
        includes: { type: string, nullable: true }
        verifiedAt: { type: string, format: date, nullable: true }
    TimeRange:
      type: object
      required: [opensAt, closesAt]
      properties:
        opensAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '09:00' }
        closesAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '22:00' }
    OpeningHours:
      type: object
      required: [status]
      description: Giờ Việt Nam. Ngoại lệ ưu tiên lịch tuần (PROP); khoảng qua đêm OQ-04.
      properties:
        status: { $ref: '#/components/schemas/KnownStatus' }
        weekly:
          type: array
          items:
            type: object
            required: [dayOfWeek, ranges]
            properties:
              dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: '1 = Thứ Hai' }
              ranges:
                type: array
                items: { $ref: '#/components/schemas/TimeRange' }
        exceptions:
          type: array
          items:
            type: object
            required: [date, closed]
            properties:
              date: { type: string, format: date }
              closed: { type: boolean }
              ranges:
                type: array
                items: { $ref: '#/components/schemas/TimeRange' }
              note: { type: string }
    PlaceImage:
      type: object
      required: [id, url, sortOrder, cover]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        caption: { type: string, nullable: true }
        sortOrder: { type: integer }
        cover: { type: boolean }
    PlaceImageWrite:
      type: object
      required: [fileId, sourceRights]
      properties:
        fileId: { type: string, format: uuid }
        caption: { type: string, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0 }
        cover: { type: boolean }
        sourceRights: { type: string, maxLength: 500, description: Nguồn và quyền sử dụng ảnh }
    PlaceCard:
      type: object
      required: [id, name, price, tags]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        areaName: { type: string, nullable: true }
        coverUrl: { type: string, format: uri, nullable: true }
        price: { $ref: '#/components/schemas/Price' }
        tags:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Taxonomy' }
        distanceKm:
          type: number
          format: double
          nullable: true
          description: Ước tính; chỉ có khi request có điểm gốc. Không phải thời gian đi.
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    PlaceSearchPage:
      type: object
      required: [items, page, searchId]
      properties:
        searchId: { type: string, format: uuid, description: Gắn với sự kiện search_submitted/results_shown }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaceCard' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PlaceDetail:
      type: object
      required: [id, code, name, price, hours, images, tags]
      description: Thứ tự hiển thị FR-05. Trường null = "Chưa có thông tin"; không có sao/đánh giá.
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: Mã chi nhánh }
        name: { type: string }
        category: { $ref: '#/components/schemas/Taxonomy' }
        area: { $ref: '#/components/schemas/Area' }
        images:
          type: array
          items: { $ref: '#/components/schemas/PlaceImage' }
        price: { $ref: '#/components/schemas/Price' }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Taxonomy' }
        hours: { $ref: '#/components/schemas/OpeningHours' }
        address: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        notes: { type: string, nullable: true, description: Lưu ý }
        reservationRecommended: { type: boolean, nullable: true }
        distanceKm: { type: number, format: double, nullable: true }
        verifiedAt: { type: string, format: date, nullable: true, description: Ngày cập nhật/kiểm tra }
    PlaceReportReason:
      type: string
      enum: [WRONG_PRICE, WRONG_HOURS, WRONG_ADDRESS, CLOSED, WRONG_IMAGE, OTHER]
    PlaceReportCreate:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/PlaceReportReason' }
        description: { type: string, maxLength: 2000 }
        fileId: { type: string, format: uuid }
    PlaceReportReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PlaceReportStatus' }
        createdAt: { type: string, format: date-time }

    # ── auth / user ──
    Role:
      type: string
      enum: [MEMBER, EDITOR, REVIEWER, SUPPORT, SUPER_ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED, DELETION_REQUESTED]
    AuthToken:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, displayName, roles, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        avatarFileId: { type: string, format: uuid, nullable: true }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            lockedReason: { type: string, nullable: true }
    AdminUserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { $ref: '#/components/schemas/PageMeta' }

    # ── saved lists ──
    SavedListWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    SavedListSummary:
      type: object
      required: [id, name, placeCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        placeCount: { type: integer }
        createdAt: { type: string, format: date-time }
    SavedListDetail:
      allOf:
        - $ref: '#/components/schemas/SavedListSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [place, available, addedAt]
                properties:
                  place: { $ref: '#/components/schemas/PlaceCard' }
                  available: { type: boolean, description: 'false = nơi đã ẩn/ngừng; chỉ hiện tên + cảnh báo, không chốt mới' }
                  addedAt: { type: string, format: date-time }

    # ── choice sessions ──
    ChoiceSessionStatus:
      type: string
      enum: [WAITING, VOTING, FINALIZED]
    VotePreference:
      type: string
      enum: [LIKE, SKIP]
    ChoiceCandidate:
      type: object
      required: [id, place, available]
      properties:
        id: { type: string, format: uuid }
        place: { $ref: '#/components/schemas/PlaceCard' }
        available: { type: boolean }
        myVote:
          allOf: [{ $ref: '#/components/schemas/VotePreference' }]
          nullable: true
          description: null = Chưa trả lời (không phải Bỏ qua)
        partnerVote:
          allOf: [{ $ref: '#/components/schemas/VotePreference' }]
          nullable: true
          description: Có được thấy phiếu riêng của nhau không — OQ-07
        mutualLike: { type: boolean }
    ChoiceSession:
      type: object
      required: [id, status, viewerRole, candidates, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ChoiceSessionStatus' }
        viewerRole: { type: string, enum: [CREATOR, RECIPIENT] }
        creatorName: { type: string }
        recipientName: { type: string, nullable: true }
        candidates:
          type: array
          minItems: 2
          maxItems: 5
          items: { $ref: '#/components/schemas/ChoiceCandidate' }
        activeShareGrant: { $ref: '#/components/schemas/ShareGrant' }
        datePlanId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time, nullable: true }
    ShareGrant:
      type: object
      required: [id, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [VALID, EXPIRED, REVOKED] }
    ShareGrantCreated:
      allOf:
        - $ref: '#/components/schemas/ShareGrant'
        - type: object
          required: [inviteToken, inviteUrl]
          properties:
            inviteToken: { type: string, description: Chỉ trả một lần; server chỉ lưu hash }
            inviteUrl: { type: string, format: uri }
    ChoiceSessionCreated:
      allOf:
        - $ref: '#/components/schemas/ChoiceSession'
        - type: object
          required: [shareGrant]
          properties:
            shareGrant: { $ref: '#/components/schemas/ShareGrantCreated' }
    ShareGrantPreview:
      type: object
      required: [creatorName, candidateCount, candidates, slotAvailable]
      properties:
        creatorName: { type: string }
        candidateCount: { type: integer }
        candidates:
          type: array
          description: Chỉ nội dung được chia sẻ; xem trước không chiếm suất hoặc bắt nhập tên.
          items: { $ref: '#/components/schemas/PlaceCard' }
        slotAvailable: { type: boolean }
        expiresAt: { type: string, format: date-time }
    RecipientSessionToken:
      type: object
      required: [recipientSession, choiceSessionId]
      properties:
        recipientSession: { type: string, description: Gửi lại qua header X-Recipient-Session }
        choiceSessionId: { type: string, format: uuid }

    # ── date plans ──
    PlaceVisitCount:
      type: object
      required: [placeId, count]
      properties:
        placeId: { type: string, format: uuid }
        count: { type: integer, format: int64, minimum: 0 }
    DateReminderStatus:
      type: string
      enum: [PENDING, SHOWN, DISMISSED, ANSWERED, CANCELLED]
    DateReminder:
      type: object
      required: [id, planId, scheduledAt, status]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/DateReminderStatus' }
        dismissedAt: { type: string, format: date-time, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
    DateReminderState:
      type: object
      required: [reminder, shouldShow, canRespond]
      properties:
        reminder:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/DateReminder' }]
        shouldShow: { type: boolean, description: 'Server tính theo scheduledAt/quyền/plan và trạng thái nhắc, không phải plan PAST.' }
        canRespond: { type: boolean, description: 'Theo actor đã duyệt; không mặc định người nhận link được ghi lượt cá nhân.' }
    DateReminderAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [CONFIRM_VISIT, DISMISS] }
    DatePlanStatus:
      type: string
      enum: [SCHEDULED, CANCELLED, PAST]
    DatePlanWrite:
      type: object
      required: [placeId, scheduledAt]
      properties:
        placeId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time, description: Phải ở tương lai }
        note: { type: string, maxLength: 1000 }
    DatePlanUpdate:
      type: object
      properties:
        placeId: { type: string, format: uuid }
        scheduledAt: { type: string, format: date-time }
        note: { type: string, maxLength: 1000, nullable: true }
    DatePlan:
      type: object
      required: [id, place, scheduledAt, status, viewerRole, reservationHeld, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        place: { $ref: '#/components/schemas/PlaceCard' }
        placeAvailable: { type: boolean }
        scheduledAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DatePlanStatus' }
        viewerRole: { type: string, enum: [OWNER, RECIPIENT] }
        reservationHeld:
          type: boolean
          enum: [false]
          description: G1 luôn false — UI hiển thị "Kế hoạch này chưa giữ chỗ tại địa điểm"
        choiceSessionId: { type: string, format: uuid, nullable: true }
        visitAnswer: { type: string, enum: [YES, NO], nullable: true, description: null = Chưa trả lời }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── support / notifications ──
    TicketStatus:
      type: string
      enum: [NEW, IN_PROGRESS, WAITING_CUSTOMER, CLOSED]
    MessageVisibility:
      type: string
      enum: [PUBLIC, INTERNAL]
    SupportTicketCreate:
      type: object
      required: [category, subject, body]
      properties:
        category: { type: string, enum: [ACCOUNT, PLACE_INFO, DATE_PLAN, OTHER] }
        subject: { type: string, maxLength: 150 }
        body: { type: string, maxLength: 5000 }
        fileIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        fileIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
    SupportMessage:
      type: object
      required: [id, authorName, visibility, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        authorName: { type: string }
        fromStaff: { type: boolean }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }
        body: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/StoredFile' }
        createdAt: { type: string, format: date-time }
    SupportTicket:
      type: object
      required: [id, category, subject, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        assigneeName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupportTicketDetail:
      allOf:
        - $ref: '#/components/schemas/SupportTicket'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/SupportMessage' }
    SupportTicketPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportTicket' }
        page: { $ref: '#/components/schemas/PageMeta' }
    Notification:
      type: object
      required: [id, type, summary, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DATE_PLAN_UPDATED, DATE_PLAN_CANCELLED, SUPPORT_REPLIED, SUPPORT_STATUS_CHANGED] }
        objectType: { type: string }
        objectId: { type: string, format: uuid }
        summary: { type: string, description: Nội dung tối thiểu; mở đối tượng phải kiểm tra quyền lại }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, page, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { $ref: '#/components/schemas/PageMeta' }
        unreadCount: { type: integer }

    # ── uploads / events ──
    StoredFile:
      type: object
      required: [id, contentType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        url: { type: string, format: uri, nullable: true, description: URL có hạn; không công khai tệp bị từ chối }
    AnalyticsEvent:
      type: object
      required: [eventId, name, occurredAt, sessionId, platform]
      description: Không gửi token, OTP, ghi chú riêng, vị trí chính xác không cần thiết.
      properties:
        eventId: { type: string, format: uuid }
        name:
          type: string
          enum: [search_submitted, results_shown, place_viewed, place_saved, comparison_opened, invite_created, vote_submitted, date_plan_created, visit_self_reported]
        occurredAt: { type: string, format: date-time }
        sessionId: { type: string, maxLength: 64 }
        anonymousId: { type: string, maxLength: 64, description: Bắt buộc nếu chưa đăng nhập }
        platform: { $ref: '#/components/schemas/Platform' }
        objectId: { type: string, maxLength: 64 }
        properties:
          type: object
          description: Whitelist theo từng event — đội giải pháp rà soát
          additionalProperties:
            type: string

    # ── admin ──
    AdminPlaceWrite:
      type: object
      required: [code, name, categoryId, areaId, address, lat, lng]
      description: Đủ trường để lưu nháp; điều kiện xuất bản đầy đủ kiểm tra khi APPROVE (RULE-20).
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{3,40}$', description: Mã chi nhánh duy nhất }
        name: { type: string, maxLength: 150 }
        categoryId: { type: string, format: uuid }
        areaId: { type: string, format: uuid }
        address: { type: string, maxLength: 300 }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        description: { type: string, maxLength: 5000 }
        phone: { type: string, maxLength: 20 }
        website: { type: string, format: uri }
        notes: { type: string, maxLength: 2000 }
        reservationRecommended: { type: boolean, nullable: true }
        tagIds:
          type: array
          items: { type: string, format: uuid }
        price:
          allOf:
            - $ref: '#/components/schemas/Price'
            - type: object
              properties:
                source: { type: string, maxLength: 500 }
        hours: { $ref: '#/components/schemas/OpeningHours' }
        source: { type: string, maxLength: 500, description: Nguồn dữ liệu }
        verifiedAt: { type: string, format: date }
    AdminPlace:
      allOf:
        - $ref: '#/components/schemas/PlaceDetail'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/PlaceStatus' }
            statusReason: { type: string, nullable: true }
            source: { type: string, nullable: true }
            createdBy: { type: string, format: uuid }
            reviewedBy: { type: string, format: uuid, nullable: true }
            publishBlockers:
              type: array
              description: Lỗi còn thiếu theo RULE-20 (rỗng = đủ điều kiện duyệt)
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AdminPlacePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPlace' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PlaceReportStatus:
      type: string
      enum: [NEW, CHECKING, RESOLVED, INSUFFICIENT]
    PlaceReport:
      type: object
      required: [id, placeId, placeName, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        placeName: { type: string }
        reason: { $ref: '#/components/schemas/PlaceReportReason' }
        description: { type: string, nullable: true }
        attachment: { $ref: '#/components/schemas/StoredFile' }
        senderUserId: { type: string, format: uuid, nullable: true }
        assigneeId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/PlaceReportStatus' }
        resolutionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlaceReportPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaceReport' }
        page: { $ref: '#/components/schemas/PageMeta' }
    ImportBatch:
      type: object
      required: [id, status, totalRows, errorRows, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [VALIDATED, INVALID, COMMITTED] }
        templateVersion: { type: string }
        totalRows: { type: integer }
        errorRows: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [rowNumber, valid]
            properties:
              rowNumber: { type: integer }
              placeCode: { type: string, nullable: true }
              valid: { type: boolean }
              errors:
                type: array
                items: { type: string }
        createdAt: { type: string, format: date-time }
        committedAt: { type: string, format: date-time, nullable: true }
    AuditLog:
      type: object
      required: [id, action, objectType, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        reason: { type: string, nullable: true }
        traceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        page: { $ref: '#/components/schemas/PageMeta' }
    MetricValue:
      type: object
      description: value null = "Chưa có dữ liệu/Không áp dụng" (mẫu số 0, cohort chưa đủ tuổi)
      properties:
        value: { type: number, format: double, nullable: true }
        note: { type: string, nullable: true }
    ReportSummary:
      type: object
      required: [dataUpdatedAt]
      properties:
        dataUpdatedAt: { type: string, format: date-time }
        activeMembers: { $ref: '#/components/schemas/MetricValue' }
        activeAnonymous: { $ref: '#/components/schemas/MetricValue' }
        searches: { $ref: '#/components/schemas/MetricValue' }
        zeroResultRate: { $ref: '#/components/schemas/MetricValue' }
        placeViews: { $ref: '#/components/schemas/MetricValue' }
        saves: { $ref: '#/components/schemas/MetricValue' }
        searchToPlanRate: { $ref: '#/components/schemas/MetricValue' }
        medianMinutesToPlan: { $ref: '#/components/schemas/MetricValue' }
        retention30d: { $ref: '#/components/schemas/MetricValue' }
        placesMissingPrice: { $ref: '#/components/schemas/MetricValue' }
        placesMissingHours: { $ref: '#/components/schemas/MetricValue' }
        placesVerificationOverdue: { $ref: '#/components/schemas/MetricValue' }
        openPlaceReports: { $ref: '#/components/schemas/MetricValue' }
