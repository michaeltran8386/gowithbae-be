  /date-plans/{planId}/visit-report:
    put:
      tags: [DatePlans]
      operationId: reportVisit
      summary: Tự xác nhận chuyến đi; không dùng để Bỏ qua lời nhắc (FR-18, FR-35, RULE-15/29)
      description: |
        Giữ tương thích thao tác ghi câu trả lời. NO là câu trả lời Không, không phải dismissal.
        Retry cùng plan/người không tạo lượt mới. Quyền actor và sửa câu trả lời còn OQ-10/25.
        UI lời nhắc dùng /reminder với CONFIRM_VISIT hoặc DISMISS, không gửi NO khi bấm Bỏ qua.
      x-status: draft
      x-oq: [OQ-10, OQ-25]
      security: [{ bearerAuth: [] }, { recipientSession: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [YES, NO] }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /date-plans/{planId}/reminder:
    get:
      tags: [DatePlans]
      operationId: getDateReminder
      summary: Trạng thái lời nhắc Đi chưa của người xem hiện tại (FR-18, RULE-15)
      description: |
        Đến scheduledAt, web hiển thị khi shouldShow=true; không cần plan chuyển PAST.
        Dismissed/answered/cancelled thì shouldShow=false kể cả tải lại. Chưa có nhắc trả reminder=null.
        Server tính shouldShow/canRespond sau kiểm tra quyền và trạng thái hiện hành, không tin client.
        Không nhắc plan đã hủy, không tự thêm email/push. Actor và nhắc lại sau sửa giờ còn OQ-10/25.
      x-status: draft
      x-oq: [OQ-10, OQ-25]
      security: [{ bearerAuth: [] }, { recipientSession: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DateReminderState' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [DatePlans]
      operationId: respondToDateReminder
      summary: Đã đi hoặc chỉ Bỏ qua lời nhắc (FR-18, FR-35, RULE-15/29)
      description: |
        DISMISS chỉ lưu dismissed/dismissedAt, giữ visitAnswer và plan, không popup khác; retry không nhắc lại.
        CONFIRM_VISIT ghi YES duy nhất và chuyển nhắc ANSWERED trong cùng transaction.
        Danh tính lấy từ phiên server; phiên khách không tự tạo lượt cá nhân. Kiểm tra quyền, plan chưa hủy,
        scheduledAt đã đến và trạng thái nhắc tại thời điểm ghi. Retry cùng action đã thành công trả trạng thái;
        action khác trên nhắc đã đóng trả 409, không tự mở lại/sửa lượt trước khi OQ-10/25 chốt.
      x-status: draft
      x-oq: [OQ-10, OQ-25]
      security: [{ bearerAuth: [] }, { recipientSession: [] }]
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DateReminderAction' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DateReminderState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

